<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vuelve Negocios · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDE8; --phone:#F6F8F5; --ink:#17223A; --muted:#5E6878; --line:#D6DCD4;
  --sun:#F2B630; --sun-soft:#FBEBC2; --teal:#1E7A6E; --teal-soft:#D5ECE7; --rose:#C8475B; --rose-soft:#F7DDE1; --surface:#FFFFFF;
  --card-ink:#17223A; --shadow:0 18px 50px rgba(23,34,58,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1522; --phone:#151C2B; --ink:#EEF1F6; --muted:#9AA4B5; --line:#2A3446;
    --sun-soft:#3B321A; --teal:#4FB8A8; --teal-soft:#1D3A3A; --rose:#E36C7E; --rose-soft:#3D2229; --surface:#1C2536;
    --shadow:0 18px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1522; --phone:#151C2B; --ink:#EEF1F6; --muted:#9AA4B5; --line:#2A3446;
  --sun-soft:#3B321A; --teal:#4FB8A8; --teal-soft:#1D3A3A; --rose:#E36C7E; --rose-soft:#3D2229; --surface:#1C2536;
  --shadow:0 18px 50px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}

/* Marco de demostración */
.page{height:100%;display:flex;flex-direction:column}
.demo-bar{display:flex;justify-content:center;gap:10px;align-items:center;padding:12px 16px 0;font-size:13px;color:var(--muted);font-weight:600}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--phone)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px 24px 24px}
.device{width:400px;max-width:100%;height:820px;max-height:100%;background:var(--phone);border-radius:38px;box-shadow:var(--shadow);overflow:hidden;position:relative;border:1px solid var(--line);container-type:inline-size;container-name:dev}
.device[data-size="tablet"]{width:1080px;height:760px;border-radius:28px}
@media (max-width:520px){
  .demo-bar{display:none}
  .stage{padding:0;align-items:stretch}
  .device,.device[data-size="tablet"]{width:100%;height:100%;max-height:none;border-radius:0;border:0;box-shadow:none}
}
#root{height:100%}

/* Shell */
.app{height:100%;display:flex;flex-direction:column}
.body{flex:1;min-height:0;display:flex}
.rail{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bhead{padding:16px 20px 10px;display:flex;align-items:center;gap:12px}
.bhead .grow{flex:1;min-width:0}
.bhead h1{font-size:22px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhead p{margin:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none;color:var(--ink)}
.iconbtn svg{width:19px;height:19px}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--phone);border-color:var(--ink)}
.scroll{flex:1;overflow-y:auto;padding:4px 20px 28px}
.wrap{max-width:none}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.tabs button,.rail button{flex:1;border:0;background:none;padding:10px 2px 12px;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs svg,.rail svg{width:22px;height:22px}
.tabs button[aria-current="page"],.rail button[aria-current="page"]{color:var(--teal)}
@container dev (min-width:600px){
  .scroll{padding:4px 24px 28px}
  .wrap{max-width:640px;margin:0 auto}
  .bhead{padding:18px 24px 10px}
}
@container dev (min-width:840px){
  .tabs{display:none}
  .rail{display:flex;flex-direction:column;gap:6px;width:92px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 0}
  .rail .logo{margin:0 auto 14px}
  .rail button{flex:none;padding:6px 0 8px}
  .rail button .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center}
  .rail button[aria-current="page"] .pill{background:var(--teal-soft)}
  .wrap{max-width:none}
  .wrap.narrow{max-width:720px}
  .split{display:grid;grid-template-columns:360px 1fr;gap:0;height:100%}
  .split>.pane{overflow-y:auto;padding:4px 24px 28px}
  .split>.pane+.pane{border-left:1px solid var(--line)}
  .scroll.has-split{padding:0;overflow:hidden}
  .agenda-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
  .agenda-grid .list{margin-bottom:0}
  .only-narrow{display:none!important}
}
.logo{width:34px;height:34px;border-radius:50%;background:var(--ink);position:relative;flex:none}
.logo::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--sun)}

/* Tipos y utilidades */
.hello{margin:6px 0 16px}
.hello h2{font-size:28px;font-weight:800;line-height:1.1}
.hello p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:700;margin:22px 0 10px}
.sec:first-child{margin-top:4px}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:#17223A}
.dot svg{width:20px;height:20px}
.dot.soft{background:var(--teal-soft);color:var(--teal)}
.dot.plain{background:var(--phone);border:1px solid var(--line);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px}
.item{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink)}
.item:last-child{border-bottom:0}
button.item{cursor:pointer}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;display:block}
.item .s{font-size:13px;color:var(--muted);display:block}
.item.sel{background:var(--teal-soft);box-shadow:inset 3px 0 0 var(--teal)}
.chev{font-size:24px;color:var(--muted);line-height:1;flex:none}
.res-head{padding:9px 14px;font-weight:700;font-size:13px;background:var(--phone);border-bottom:1px solid var(--line);color:var(--muted);display:flex;flex-direction:column;gap:2px}
.res-head b{color:var(--ink);font-size:14px}
.res-head span{font-weight:500}
.time{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;width:66px;flex:none;line-height:1.2}
.time small{display:block;font-family:Figtree,sans-serif;font-weight:500;font-size:12px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.st{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st.CONFIRMED{background:var(--teal-soft);color:var(--teal)}
.st.PENDING_DEPOSIT{background:var(--sun-soft);color:var(--ink)}
.st.ATTENDED{background:var(--ink);color:var(--phone)}
.st.NO_SHOW{background:var(--rose-soft);color:var(--rose)}
.st.CANCELLED{background:var(--line);color:var(--muted)}
.badge{display:inline-flex;align-items:center;background:#17223A;color:#F2B630;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.note{font-size:13px;padding:10px 12px;border-radius:12px;margin:10px 0}
.note.sun{background:var(--sun-soft)}
.note.teal{background:var(--teal-soft)}
.note.rose{background:var(--rose-soft);color:var(--rose)}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}

/* Botones y controles */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--ink);color:var(--phone);min-height:44px}
.btn.full{width:100%}
.btn.sun{background:var(--sun);color:#17223A}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.teal{background:var(--teal);color:#fff}
.btn.rose{background:transparent;color:var(--rose);border:1px solid var(--rose)}
.btn.sm{padding:7px 12px;border-radius:10px;font-size:13px;min-height:34px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:6px 0;font-weight:600;color:var(--teal)}
label.f{display:block;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:5px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;color:var(--ink)}
label.f input:disabled{opacity:.7}
.flabel{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;flex:none}
.chip small{font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--phone);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.chip.closed{border-style:dashed;color:var(--muted)}
.chip.franja{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 12px}
.chip.franja.bad{border:1px dashed var(--rose);color:var(--rose)}
.chip .x{border:0;background:var(--phone);width:24px;height:24px;border-radius:50%;padding:0;font-weight:700;color:var(--muted);line-height:1}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-weight:600;font-size:13.5px}
.slot[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.search{display:block;position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500}
.search::before{content:"";position:absolute;left:14px;top:50%;width:13px;height:13px;border:2px solid var(--muted);border-radius:50%;transform:translateY(-62%)}
.search::after{content:"";position:absolute;left:27px;top:58%;width:6px;height:2px;background:var(--muted);transform:rotate(45deg)}
.switch{position:relative;width:44px;height:26px;border-radius:999px;background:var(--line);border:0;flex:none;transition:background .2s;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{background:var(--teal)}
.switch[aria-checked="true"]::after{left:21px}

/* Tarjeta de sellos */
.card{position:relative;border-radius:22px;padding:18px 18px 16px;margin-bottom:14px;color:#17223A;overflow:hidden;border:0;width:100%;text-align:left;display:block}
.card .biz{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;line-height:1.1}
.card .rule{font-size:13px;opacity:.82;margin-top:2px}
.card .notch{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--phone);transform:translateY(-50%)}
.card .notch.l{left:-11px}.card .notch.r{right:-11px}
.holes{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);gap:9px;margin-top:16px}
.hole{aspect-ratio:1;border-radius:50%;border:2px dashed rgba(23,34,58,.35);display:grid;place-items:center;font-size:11px;font-weight:700;color:rgba(23,34,58,.45);max-width:52px;width:100%;justify-self:center}
.hole.on{border:0;background:#17223A;color:var(--cat)}
.hole.prize{border-style:solid;border-color:rgba(23,34,58,.6)}
.hole.prize svg{width:55%;height:55%}
.hole.on.prize{background:#17223A;color:#F2B630}
.card .foot{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;font-weight:600}
.pulse{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* Código de premio */
.codecells{display:grid;grid-template-columns:repeat(6,44px);gap:8px;justify-content:start}
.codecells input{width:44px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:700;text-transform:uppercase;color:var(--ink);padding:0}
.codecells input:focus{outline:none;border:3px solid var(--sun)}
.codecells.err input{border-color:var(--rose)}
.code{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;font-weight:800;letter-spacing:.12em;text-align:center;background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:16px;margin:10px 0}

/* Estadísticas */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
@container dev (min-width:840px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:28px;line-height:1}
.stat span{font-size:13px;color:var(--muted)}

/* Sheets, diálogos y toast */
.sheet-bg{position:absolute;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--phone);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:22px;font-weight:700;margin-bottom:14px}
.dialog-bg{position:absolute;inset:0;background:rgba(10,15,25,.45);display:grid;place-items:center;z-index:12;padding:20px}
.dialog{background:var(--phone);border-radius:22px;padding:20px;max-width:380px;width:100%;animation:up .2s ease-out}
.dialog h3{font-size:18px;font-weight:700;margin-bottom:8px}
.dialog p{margin:0 0 6px}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--phone);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;max-width:85%;text-align:center}
@container dev (min-width:840px){.toast{bottom:28px}}
.savebar{position:sticky;bottom:-28px;background:var(--phone);border-top:1px solid var(--line);padding:12px 0 28px;margin-top:16px}
.savebar p{margin:0 0 8px;font-size:13px;color:var(--muted);text-align:center}

/* Login y desbloqueo */
.auth{height:100%;overflow-y:auto;padding:40px 24px 24px;display:flex;flex-direction:column;max-width:440px;margin:0 auto}
.auth .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.auth .brand h1{font-size:24px;font-weight:800}
.auth .brand span{font-size:13px;color:var(--muted);display:block;font-weight:600}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:22px 0}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots span.on{background:var(--ink);border-color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.keypad button{height:60px;border-radius:30px;border:1px solid var(--line);background:var(--surface);font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:700}
.keypad button.blank{visibility:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <div class="demo-bar"><span>Vista del prototipo</span>
    <div class="seg" role="group" aria-label="Tamaño de pantalla"><button id="vPhone" aria-pressed="true">Teléfono</button><button id="vTablet" aria-pressed="false">Tablet</button></div>
  </div>
  <div class="stage"><div class="device" id="device" data-size="phone"><div id="root"></div></div></div>
</div>
<script>
/* ================= Íconos ================= */
const I={
  scissors:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg>',
  ball:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 5h-5L8 10z"/></svg>',
  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
  food:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 2-2 6 0 8v10"/></svg>',
  coffee:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17M8 3v3M12 3v3"/></svg>',
  gift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="8" width="18" height="5"/><path d="M5 13v8h14v-8M12 8v13M12 8S10 3 7.5 4.5 9 8 12 8zm0 0s2-5 4.5-3.5S15 8 12 8z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  calOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v4M16 3v4M3 10h7M21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h1M14 5h5a2 2 0 0 1 2 2v3M2 2l20 20"/></svg>',
  calX:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M10 14l4 4M14 14l-4 4"/></svg>',
  stamp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h14M19.3 14H4.7a1.7 1.7 0 0 0-1.7 1.7V18h18v-2.3a1.7 1.7 0 0 0-1.7-1.7zM14 14V9.5a3.5 3.5 0 1 0-4 0V14"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6 6 0 0 1 3.5 5.5"/></svg>',

/* Franjas */
const clean=ws=>ws.filter(w=>w[1]>w[0]).sort((a,b)=>a[0]-b[0]);
function intersect(a,b){const out=[];a.forEach(x=>b.forEach(y=>{const s=Math.max(x[0],y[0]),e=Math.min(x[1],y[1]);if(e>s)out.push([s,e]);}));return clean(out);}
function subtract(ws,s,e){const out=[];ws.forEach(w=>{if(e<=w[0]||s>=w[1]){out.push(w);return;}if(s>w[0])out.push([w[0],s]);if(e<w[1])out.push([e,w[1]]);});return clean(out);}
function weeklyBiz(b,d){ if(b.hours) return b.hours[d]||[]; const c=b.booking||{open:8,close:20}; return [[H(c.open),H(c.close)]]; }
const excOn=(b,date,resId)=>b.exceptions.filter(x=>x.from<=date&&date<=x.to&&(resId===undefined?x.resId===null:(x.resId===null||x.resId===resId)));
function applyExc(ws,list){ list.forEach(x=>{ ws=x.startMin==null?[]:subtract(ws,x.startMin,x.endMin); }); return ws; }
function bizWindows(b,date){ return applyExc(weeklyBiz(b,dowOf(date)),excOn(b,date)); }
function resWindows(b,r,date){
  const d=dowOf(date), bw=weeklyBiz(b,d), rw=r.schedule?(r.schedule[d]||[]):bw;
  return applyExc(intersect(rw,bw),excOn(b,date,r.id));
}
function busy(b,resId,date,s,dur,ignore){return S.bookings.some(k=>k.id!==ignore&&k.bizId===b.id&&k.resId===resId&&k.date===date&&k.status!=='CANCELLED'&&k.start<s+dur&&s<k.start+k.dur);}
function slotsFor(b,st){
  const cp=caps(b), out=[]; let dur,step,res;
  if(cp.kind==='STAFF'){ const s=svcOf(b,st.serviceId); if(!s) return out; dur=s.duration; step=30;
    res=activeRes(b).filter(r=>r.serviceIds.includes(s.id)&&(st.staffId==='any'||r.id===st.staffId)); }
  else { dur=60; step=60; res=activeRes(b).filter(r=>r.id===st.courtId); }
  const now=new Date(), today=st.date===dayKey(now), nowMin=now.getHours()*60+now.getMinutes();
  const seen=new Set();
  res.forEach(r=>resWindows(b,r,st.date).forEach(([ws,we])=>{
    for(let t=Math.ceil(ws/step)*step;t+dur<=we;t+=step){
      if(today&&t<=nowMin) continue; if(seen.has(t)) continue;
      if(!busy(b,r.id,st.date,t,dur)){ seen.add(t); out.push({t,resId:r.id,dur}); }
    }
  }));
  return out.sort((a,b2)=>a.t-b2.t);
}
function priceFor(b,st,t){ if(caps(b).kind==='STAFF') return (svcOf(b,st.serviceId)||{price:0}).price; return t>=H(b.booking.nightFrom)?b.booking.nightPrice:b.booking.dayPrice; }
const needsDeposit=(b,c)=>b.booking&&b.booking.depositAfter>0&&noShows(b,c)>=b.booking.depositAfter;
const linked=b=>(b.booking?.programIds||[]).map(prog).filter(p=>p&&p.active&&p.bizId===b.id);
function bookingWhat(b,k){ const r=resOf(b,k.resId); if(caps(b).kind==='STAFF') return `${(svcOf(b,k.serviceId)||{name:'Servicio'}).name} con ${r?r.name:'—'}`; return r?r.name:'—'; }
function notifyCust(b){ S.sent[b.id]=(S.sent[b.id]||0)+1; }
function addStamp(b,c,p){
  const m=member(c.id,p.id,true); m.count++; m.last=Date.now(); m.history.push({t:Date.now(),kind:'STAMP'});
  let unlocked=null;
  if(m.count>=p.goal){ unlocked={id:uid(),custId:c.id,progId:p.id,code:code6(),status:'AVAILABLE',created:Date.now(),expires:Date.now()+p.expiry*DAY};
    S.rewards.push(unlocked); m.history.push({t:Date.now(),kind:'REWARD'}); m.count=p.reset?0:p.goal; notifyCust(b); }
  else if(p.goal-m.count===1) notifyCust(b);
  return {m,unlocked};
}
function custActivity(b,c){
  const ps=new Set(S.progs.filter(p=>p.bizId===b.id).map(p=>p.id));
  const t1=Math.max(0,...S.members.filter(m=>m.custId===c.id&&ps.has(m.progId)).map(m=>m.last||0));
  const t2=Math.max(0,...S.bookings.filter(k=>k.bizId===b.id&&k.custId===c.id).map(k=>keyTime(k.date,k.start)).filter(t=>t<=Date.now()));
  return Math.max(t1,t2);
}
function bizCustomers(b){
  const ps=new Set(S.progs.filter(p=>p.bizId===b.id).map(p=>p.id));
  return S.custs.filter(c=>S.members.some(m=>m.custId===c.id&&ps.has(m.progId))||S.bookings.some(k=>k.bizId===b.id&&k.custId===c.id));
}
function searchCustomers(q,limit=5){
  const n=norm(q.trim()); if(!n) return [];
  const digits=q.replace(/\D/g,'');
  return S.custs.filter(c=>norm(c.name).includes(n)||(digits.length>=3&&c.phone.includes(digits))||norm(custCode(c))===n).slice(0,limit);
}

function applyTheme(){ const r=document.documentElement; if(S.theme==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',S.theme); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; dev().appendChild(t); setTimeout(()=>t.remove(),2600); }
function sheet(html,onMount){
  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-body">${html}</div></div>`;
  bg.addEventListener('click',e=>{if(e.target===bg)bg.remove();});
  dev().appendChild(bg);
  const close=()=>bg.remove();
  const body=bg.querySelector('.sheet-body');
  body.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  onMount&&onMount(body,close);
  const f=body.querySelector('input,select,button'); f&&f.focus({preventScroll:true});
  return {body,close};
}
function confirmDialog({title,text,notice,cta,danger,onOk}){
  const bg=document.createElement('div'); bg.className='dialog-bg';
  bg.innerHTML=`<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:''}${notice?`<p class="small muted">${esc(notice)}</p>`:''}
    <div class="row" style="margin-top:16px"><button class="btn ghost" data-no style="flex:1">Volver</button><button class="btn ${danger?'rose':'teal'}" data-ok style="flex:1">${esc(cta)}</button></div></div>`;
  dev().appendChild(bg);
  bg.querySelector('[data-no]').onclick=()=>bg.remove();
  bg.querySelector('[data-ok]').onclick=()=>{bg.remove();onOk();};
  bg.querySelector('[data-ok]').focus();
}
function guard(fn){ if(!ui.dirty) return fn(); confirmDialog({title:'Tienes cambios sin guardar',text:'Si sales ahora, se pierden.',cta:'Salir sin guardar',danger:true,onOk:()=>{ui.dirty=false;ui.draft=null;fn();}}); }

/* ================= Componentes ================= */
function punchCard(p,m,opts={}){
  const b=S.biz.find(x=>x.id===p.bizId), cp=caps(b), n=m?m.count:0;
  const cols=p.goal<=5?5:(p.goal%5===0||p.goal>12?5:Math.min(6,p.goal));
  let holes='';
  for(let i=1;i<=p.goal;i++){ const on=i<=n, prize=i===p.goal, pop=opts.popIndex===i?' pulse':'';
    holes+=`<div class="hole${on?' on':''}${prize?' prize':''}${pop}" aria-hidden="true">${prize?I.gift:i}</div>`; }
  const left=p.goal-n;
  return `<div class="card" style="background:${cp.color};--cat:${cp.color};--cols:${cols}" role="img" aria-label="${esc(b.name)}, ${p.name}, ${n} de ${p.goal} ${UNITS[p.unit]}">
    <span class="notch l"></span><span class="notch r"></span>
    <div class="row between" style="align-items:flex-start"><div><div class="biz">${esc(opts.title||b.name)}</div><div class="rule">${esc(ruleText(p))}</div></div>
    <div class="dot" style="background:rgba(255,255,255,.5)">${I[cp.icon]}</div></div>
    <div class="holes">${holes}</div>
    <div class="foot"><span>${n} de ${p.goal} ${UNITS[p.unit]}</span><span>${left<=0?'¡Lista!':left===1?'Te falta 1':'Te faltan '+left}</span></div></div>`;
}
function dayStrip(b,selected,attr,withCounts){
  return `<div class="chips scrollx" role="group" aria-label="Día">${[0,1,2,3,4,5,6].map(i=>{const k=dayFrom(i);
    const closed=!bizWindows(b,k).length;
    const n=withCounts?S.bookings.filter(x=>x.bizId===b.id&&x.date===k&&x.status!=='CANCELLED').length:0;
    return `<button class="chip${closed?' closed':''}" ${attr}="${k}" aria-pressed="${k===selected}">${dayLabel(k)}${closed?' <small>Cerrado</small>':n?` <small>${n}</small>`:''}</button>`}).join('')}</div>`;
}
function bookingTile(b,k){
  const c=cust(k.custId), ns=noShows(b,c);
  let acts='';
  if(k.status==='CONFIRMED') acts=`<div class="acts"><button class="btn teal sm" data-done="${k.id}">Atendida</button><button class="btn ghost sm" data-noshow="${k.id}">No asistió</button><button class="btn rose sm" data-cancel="${k.id}">Cancelar</button></div>`;
  if(k.status==='PENDING_DEPOSIT') acts=`<div class="acts"><button class="btn sun sm" data-deposit="${k.id}">Confirmar abono</button><button class="btn rose sm" data-cancel="${k.id}">Cancelar</button></div>`;
  const hm=fmtHM(k.start).split(' ');
  return `<div class="item" style="align-items:flex-start">
    <div class="time">${hm[0]}<small>${hm.slice(1).join(' ')}</small></div>
    <div class="grow"><span class="t">${esc(c.name)}</span>
      <span class="s">${esc(bookingWhat(b,k))} · ${k.dur} min · ${money(k.price)}</span>
      <div style="margin-top:5px;gap:6px" class="row wrapx"><span class="st ${k.status}">${ST_LABEL[k.status]}</span>${k.stamped?'<span class="st CONFIRMED">Sello sumado</span>':''}${ns&&['CONFIRMED','PENDING_DEPOSIT'].includes(k.status)?`<span class="st NO_SHOW">${ns} ${ns===1?'inasistencia':'inasistencias'}</span>`:''}</div>
      ${acts}</div></div>`;
}
/* Buscador de cliente reutilizable */
function customerPicker(el,st,onChange,opts={}){
  const draw=()=>{
    if(st.custId){ const c=cust(st.custId), p=opts.progId?prog(opts.progId()):null, m=p?member(c.id,p.id):null;
      el.innerHTML=`<div class="list" style="margin-bottom:0"><div class="item sel"><div class="dot soft">${I.user}</div>
        <div class="grow"><span class="t">${esc(c.name)}</span><span class="s">${c.phone} · ${custCode(c)}</span></div>
        <button class="btn ghost sm" data-chg>Cambiar</button></div></div>`;
      el.querySelector('[data-chg]').onclick=()=>{st.custId=null;st.q='';draw();onChange();setTimeout(()=>el.querySelector('input')?.focus(),0);};
      return; }
    const res=searchCustomers(st.q||'');
    const p=opts.progId?prog(opts.progId()):null;
    el.innerHTML=`<label class="search"><span class="sr">Buscar cliente</span><input type="search" value="${esc(st.q||'')}" placeholder="Nombre, celular o código" autocomplete="off"></label>
      <div class="res" style="margin-top:8px">${(st.q||'').trim()?(res.length?`<div class="list" style="margin-bottom:0">${res.map(c=>{const m=p?member(c.id,p.id):null;return `<button class="item" data-pick="${c.id}"><div class="dot plain">${I.user}</div><div class="grow"><span class="t">${esc(c.name)}</span><span class="s">${c.phone} · ${custCode(c)}</span></div>${p?`<span class="badge">${m?m.count:0}/${p.goal}</span>`:''}</button>`}).join('')}</div>`
        :`<div class="list" style="margin-bottom:0"><div class="item"><div class="grow"><span class="t">No encontramos a nadie con ese dato</span><span class="s">Revisa el número o regístralo.</span></div><button class="btn ghost sm" data-new>Registrar cliente nuevo</button></div></div>`):`<button class="linkbtn" data-new>Registrar cliente nuevo</button>`}</div>`;
    const inp=el.querySelector('input');
    inp.oninput=()=>{st.q=inp.value;const pos=inp.selectionStart;draw();const n=el.querySelector('input');n.focus();n.setSelectionRange(pos,pos);};
    el.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{st.custId=x.dataset.pick;draw();onChange();});
    el.querySelectorAll('[data-new]').forEach(x=>x.onclick=()=>newCustomerSheet(st.q,c=>{st.custId=c.id;draw();onChange();}));
  };
  draw();
}
function newCustomerSheet(q,done){
  const digits=(q||'').replace(/\D/g,''), name=digits?'':(q||'').trim();
  sheet(`<h3>Cliente nuevo</h3>
    <label class="f">Nombre completo<input id="nc-name" value="${esc(name)}" autocomplete="off"></label>
    <label class="f">Celular<input id="nc-phone" inputmode="numeric" maxlength="10" value="${esc(digits)}" placeholder="10 dígitos"></label>
    <p class="small muted" id="nc-err" role="alert"></p>
    <div class="row"><button class="btn ghost" data-close style="flex:1">Cancelar</button><button class="btn teal" id="nc-save" style="flex:1">Registrar cliente</button></div>`,(el,close)=>{
    el.querySelector('#nc-save').onclick=()=>{
      const n=el.querySelector('#nc-name').value.trim(), ph=el.querySelector('#nc-phone').value.replace(/\D/g,''), err=el.querySelector('#nc-err');
      if(!n){err.textContent='Escribe el nombre del cliente.';return;}
      if(ph.length!==10){err.textContent='El celular debe tener 10 dígitos.';return;}
      if(S.custs.some(c=>c.phone===ph)){err.textContent='Ese celular ya está registrado. Búscalo por su número.';return;}
      const c={id:uid(),name:n,phone:ph}; S.custs.push(c); save(); close(); toast('Cliente registrado'); done(c);
    };
  });
}
function rewardUnlockedSheet(b,c,list){
  const {p}=list[0];
  sheet(`<h3>¡Tarjeta completa!</h3>
    ${punchCard(p,{count:p.goal},{popIndex:p.goal})}
    ${list.map(({p,r})=>`<p style="margin:4px 0 0">${esc(first(c))} ganó: <b>${esc(p.reward)}</b></p><div class="code" aria-label="Código ${r.code.split('').join(' ')}">${r.code}</div>`).join('')}
    <div class="row"><button class="btn ghost" data-close style="flex:1">Guardar para después</button><button class="btn teal" id="useNow" style="flex:1">Canjear ahora</button></div>`,
    (el,close)=>{el.querySelector('#useNow').onclick=()=>{list.forEach(({r})=>{r.status='REDEEMED';r.redeemed=Date.now();});save();close();render();toast('Premio canjeado');};});
}

/* ================= Login y bloqueo ================= */
function loginView(){
  return `<div class="auth">
    <div class="brand"><div class="logo"></div><div><h1>Vuelve Negocios</h1><span>Para dueños de comercios</span></div></div>
    <div class="hello" style="margin-top:0"><h2>Inicia sesión</h2><p>Usa el correo con el que registramos tu negocio.</p></div>
    <label class="f">Correo<input id="lg-email" type="email" autocomplete="username" value="${esc(ui.lgEmail||'')}"></label>
    <label class="f">Contraseña<input id="lg-pass" type="password" autocomplete="current-password"></label>
    <p class="small" id="lg-err" role="alert" style="color:var(--rose);min-height:20px;margin:0 0 6px"></p>
    <button class="btn full" id="lg-go">Entrar</button>
    <button class="linkbtn" id="lg-forgot" style="margin-top:8px">Olvidé mi contraseña</button>
    <div class="sec">Cuentas de prueba</div>
    <p class="small muted" style="margin-top:-4px">Cada una muestra un tipo de negocio. Contraseña: demo123</p>
    <div class="list">${S.accounts.map(a=>{const b=S.biz.find(x=>x.id===a.bizId),cp=caps(b);return `<button class="item" data-demo="${a.email}"><div class="dot" style="background:${cp.color}">${I[cp.icon]}</div><div class="grow"><span class="t">${esc(b.name)}</span><span class="s">${cp.label} · ${a.email}</span></div><span class="chev">›</span></button>`}).join('')}</div>
  </div>`;
}
function bindLogin(){
  const go=()=>{
    const e=$('#lg-email').value.trim().toLowerCase(), p=$('#lg-pass').value, a=S.accounts.find(x=>x.email===e);
    if(!a||a.pass!==p){ $('#lg-err').textContent='Correo o contraseña incorrectos.'; return; }
    const b=S.biz.find(x=>x.id===a.bizId);
    if(b.status!=='ACTIVE'){ $('#lg-err').textContent='Este negocio está inactivo. Escríbenos para reactivarlo.'; return; }
    S.session={email:a.email,bizId:a.bizId,name:a.name}; S.locked=false; ui={...ui,tab:null,settings:null,draft:null,dirty:false,custSel:null,custQ:'',agendaDate:dayFrom(0),stamps:{q:'',custId:null,progId:null,code:''}}; save(); render();
    if(!S.pin) setTimeout(()=>offerPin(),300);
  };
  $('#lg-go').onclick=go; $('#lg-pass').onkeydown=e=>{if(e.key==='Enter')go();};
  $('#lg-forgot').onclick=()=>toast('Pronto podrás restablecerla desde aquí. Por ahora escríbenos.');
  document.querySelectorAll('[data-demo]').forEach(x=>x.onclick=()=>{ui.lgEmail=x.dataset.demo;$('#lg-email').value=x.dataset.demo;$('#lg-pass').value='demo123';$('#lg-err').textContent='';$('#lg-go').focus();});
}
function offerPin(){
  sheet(`<h3>Protege la app con un PIN</h3><p class="muted" style="margin-top:-6px">El celular o la tablet del mostrador suele quedar a la vista. Con un PIN de 4 dígitos nadie más entra a tu negocio.</p>
    <div class="row" style="margin-top:14px"><button class="btn ghost" data-close style="flex:1">Ahora no</button><button class="btn teal" id="mkpin" style="flex:1">Crear PIN</button></div>`,(el,close)=>{
    el.querySelector('#mkpin').onclick=()=>{close();pinSheet();};});
}
function keypad(onDigit,onDel){
  return `<div class="keypad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button ${k===''?'class="blank" tabindex="-1"':''} data-k="${k}" aria-label="${k==='⌫'?'Borrar':k}">${k}</button>`).join('')}</div>`;
}
function pinSheet(){
  let step=1,a='',v='';
  const {body,close}=sheet('<div id="pin"></div>');
  const draw=()=>{
    body.querySelector('#pin').innerHTML=`<h3>${step===1?'Crea tu PIN':'Repite tu PIN'}</h3><p class="muted" style="margin:-6px 0 0">Evita 1234, 0000 y fechas fáciles.</p>
      <div class="pin-dots">${[0,1,2,3].map(i=>`<span class="${i<v.length?'on':''}"></span>`).join('')}</div><p class="small" id="pin-err" style="color:var(--rose);text-align:center;min-height:20px"></p>${keypad()}`;
    body.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{const k=x.dataset.k; if(k==='⌫'){v=v.slice(0,-1);draw();return;} if(k===''||v.length>=4) return; v+=k; draw();
      if(v.length===4){ setTimeout(()=>{
        if(step===1){ if(/^(\d)\1{3}$/.test(v)||['1234','4321','0123','9876'].includes(v)){ v=''; draw(); body.querySelector('#pin-err').textContent='Ese PIN es muy fácil. Prueba otro.'; return; }
          a=v; v=''; step=2; draw(); }
        else if(v===a){ S.pin=a; save(); close(); toast('PIN creado'); render(); }
        else { v=''; step=1; a=''; draw(); body.querySelector('#pin-err').textContent='No coinciden. Empieza de nuevo.'; } },150); } });
  };
  draw();
}
function lockView(){ return `<div class="auth" style="align-items:center;justify-content:center;text-align:center"><div class="logo" style="margin-bottom:16px"></div><h2 style="font-size:24px">Escribe tu PIN</h2><p class="muted" style="margin:4px 0 0">${esc(B().name)}</p><div class="pin-dots" id="ld"></div><p class="small" id="lk-err" style="color:var(--rose);min-height:20px"></p>${keypad()}<button class="linkbtn" id="lk-out" style="margin-top:18px">Cerrar sesión</button></div>`; }
function bindLock(){
  let v='', fails=0;
  const dots=()=>{$('#ld').innerHTML=[0,1,2,3].map(i=>`<span class="${i<v.length?'on':''}"></span>`).join('');};
  dots();
  document.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{const k=x.dataset.k; if(k==='⌫'){v=v.slice(0,-1);dots();return;} if(k===''||v.length>=4) return; v+=k; dots();
    if(v.length===4) setTimeout(()=>{ if(v===S.pin){S.locked=false;save();render();} else { fails++; v=''; dots();
      if(fails>=5){ S.session=null; S.locked=false; save(); render(); toast('Demasiados intentos. Inicia sesión de nuevo.'); return; }
      $('#lk-err').textContent=`PIN incorrecto. Te quedan ${5-fails} intentos.`; } },150); });
  $('#lk-out').onclick=()=>{S.session=null;S.locked=false;save();render();};
}

/* ================= Shell ================= */
function tabsFor(b){
  const t=[]; if(caps(b).hasBooking) t.push(['agenda','Agenda','cal']);
  t.push(['stamps','Sellos','stamp'],['programs','Programas','list'],['customers','Clientes','users'],['stats','Resumen','chart']); return t;
}
function shellView(){
  const b=B(), cp=caps(b), tabs=tabsFor(b);
  if(!tabs.some(t=>t[0]===ui.tab)) ui.tab=tabs[0][0];
  const nav=cls=>tabs.map(([k,l,i])=>`<button data-tab="${k}" ${!ui.settings&&k===ui.tab?'aria-current="page"':''}>${cls?`<span class="pill">${I[i]}</span>`:I[i]}<span>${l}</span></button>`).join('');
  const split=!ui.settings&&ui.tab==='customers'&&isWide();
  return `<div class="app"><div class="body">
    <nav class="rail" aria-label="Secciones"><div class="logo"></div>${nav(true)}</nav>
    <div class="main">
      <header class="bhead"><div class="dot" style="background:${cp.color}">${I[cp.icon]}</div>
        <div class="grow"><h1>${esc(b.name)}</h1><p>${cp.label} · ${esc(b.address)}</p></div>
        <button class="iconbtn" id="gear" aria-label="Ajustes" aria-pressed="${!!ui.settings}">${I.settings}</button></header>
      <main class="scroll${split?' has-split':''}" id="view">${ui.settings?settingsView(b):({agenda:agendaView,stamps:stampsView,programs:programsView,customers:customersView,stats:statsView}[ui.tab])(b)}</main>
    </div></div>
    <nav class="tabs" aria-label="Secciones">${nav(false)}</nav></div>`;
}
function render(){
  applyTheme();
  const root=$('#root');
  if(!S.session){ root.innerHTML=loginView(); bindLogin(); return; }
  if(!B()){ S.session=null; save(); return render(); }
  if(S.locked&&S.pin){ root.innerHTML=lockView(); bindLock(); return; }
  const keep=$('#view')?.scrollTop||0;
  root.innerHTML=shellView();
  document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>guard(()=>{ui.tab=x.dataset.tab;ui.settings=null;ui.custSel=ui.tab==='customers'?ui.custSel:null;render();$('#view').scrollTop=0;}));
  $('#gear').onclick=()=>guard(()=>{ui.settings=ui.settings?null:'home';render();$('#view').scrollTop=0;});
  const v=$('#view');
  if(ui.settings) bindSettings(v,B()); else ({agenda:bindAgenda,stamps:bindStamps,programs:bindPrograms,customers:bindCustomers,stats:bindStats}[ui.tab])(v,B());
  if(ui.keepScroll){ v.scrollTop=keep; ui.keepScroll=false; }
}
function rerender(){ ui.keepScroll=true; render(); }

/* ================= Agenda ================= */
function agendaView(b){
  const day=S.bookings.filter(k=>k.bizId===b.id&&k.date===ui.agendaDate).sort((x,y)=>x.start-y.start);
  const pend=day.filter(k=>['CONFIRMED','PENDING_DEPOSIT'].includes(k.status)).length;
  const live=day.filter(k=>k.status!=='CANCELLED').length;
  const res=activeRes(b), kd=KIND[caps(b).kind];
  const bizClosed=!bizWindows(b,ui.agendaDate).length, bizExc=excOn(b,ui.agendaDate).find(x=>x.startMin==null);
  return `<div class="row between" style="margin:6px 0 12px"><h2 style="font-size:28px;font-weight:800">Agenda</h2><button class="btn sun sm" data-act="newbooking">Nueva reserva</button></div>
    ${dayStrip(b,ui.agendaDate,'data-day',true)}
    <p class="small muted" style="margin:10px 0">${live?`${live} ${live===1?'reserva':'reservas'} · ${pend} por atender`:'Sin reservas este día.'}</p>
    ${bizClosed?`<div class="note sun">${bizExc?`Cerrado: ${esc(bizExc.reason)}.`:'El negocio no abre este día según su horario.'} Puedes cambiarlo en Ajustes.</div>`:''}
    ${res.length?`<div class="agenda-grid">${res.map(r=>{
      const items=day.filter(k=>k.resId===r.id), wins=resWindows(b,r,ui.agendaDate), ex=excOn(b,ui.agendaDate,r.id);
      const off=!wins.length, reason=ex.find(x=>x.startMin==null)?.reason;
      const partial=ex.filter(x=>x.startMin!=null);
      return `<div class="list"><div class="res-head"><b>${esc(r.name)}</b>${wins.length?`<span>${wins.map(w=>fmtRange(w[0],w[1])).join(' y ')}</span>`:''}</div>
        ${partial.map(x=>`<div class="item"><div class="dot plain" style="color:var(--muted)">${I.calOff}</div><div class="grow"><span class="s">${esc(x.reason)}: no disponible de ${fmtRange(x.startMin,x.endMin)}</span></div></div>`).join('')}
        ${items.length?items.map(k=>bookingTile(b,k)).join(''):off?`<div class="item"><div class="dot plain" style="color:var(--muted)">${I.calOff}</div><div class="grow"><span class="t">No trabaja ${ui.agendaDate===dayFrom(0)?'hoy':'este día'}</span><span class="s">${esc(reason||'Fuera de su horario semanal')}</span></div></div>`:'<div class="item"><div class="grow"><span class="s">Libre todo el día</span></div></div>'}</div>`}).join('')}</div>`
      :`<div class="empty">Agrega ${kd.many.toLowerCase()} en Ajustes para recibir reservas.</div><button class="btn ghost full" data-act="gores">Ir a ${kd.many}</button>`}`;
}
function markDone(b,k){
  const c=cust(k.custId); k.status='ATTENDED'; const unlocked=[];
  if(!k.stamped){ const ps=linked(b); ps.forEach(p=>{const r=addStamp(b,c,p); if(r.unlocked) unlocked.push({p,r:r.unlocked});}); k.stamped=ps.length>0; }
  save(); rerender();
  if(unlocked.length) rewardUnlockedSheet(b,c,unlocked);
  else toast(k.stamped?`Atendida. Sello sumado a ${first(c)}.`:'Reserva marcada como atendida');
}
function bindAgenda(v,b){
  v.querySelectorAll('[data-day]').forEach(x=>x.onclick=()=>{ui.agendaDate=x.dataset.day;rerender();});
  v.querySelectorAll('[data-done]').forEach(x=>x.onclick=()=>markDone(b,S.bookings.find(k=>k.id===x.dataset.done)));
  v.querySelectorAll('[data-noshow]').forEach(x=>x.onclick=()=>{
    const k=S.bookings.find(y=>y.id===x.dataset.noshow), c=cust(k.custId);
    confirmDialog({title:`¿${first(c)} no asistió?`,text:'Se suma una inasistencia a su historial en tu negocio.',cta:'Registrar inasistencia',danger:true,onOk:()=>{
      k.status='NO_SHOW'; const key=`${b.id}:${c.id}`; S.noShows[key]=(S.noShows[key]||0)+1; save(); rerender();
      const n=S.noShows[key], lim=b.booking.depositAfter;
      toast(lim&&n>=lim?`${first(c)} lleva ${n} inasistencias: sus próximas reservas pedirán abono.`:`Inasistencia registrada (${n}).`);}});
  });

function newBookingSheet(b,preset){

      :`<div class="flabel">Cancha</div><div class="chips">${activeRes(b).map(r=>`<button class="chip" data-k="${r.id}" aria-pressed="${r.id===st.courtId}">${esc(r.name)}</button>`).join('')}</div>`)
      +`<div class="flabel">Día</div>${dayStrip(b,st.date,'data-d',false)}
      <div class="flabel">Hora</div>${sl.length?`<div class="slots">${sl.map(x=>`<button class="slot" data-t="${x.t}" aria-pressed="${st.slot?.t===x.t}">${fmtHM(x.t)}</button>`).join('')}</div>`:'<div class="empty" style="padding:12px">No quedan horas libres ese día. Prueba con otro día u otra opción.</div>'}

      ${ps.length?`<div class="note teal">Al asistir, ${c?esc(first(c)):'el cliente'} suma 1 sello en: ${ps.map(p=>esc(p.name)).join(' y ')}.</div>`:''}
      <button class="btn teal full" id="nb-go" style="margin-top:8px" ${st.slot&&c?'':'disabled'}>${!c?'Elige un cliente':!st.slot?'Elige una hora':'Crear reserva'}</button>`;
    rest.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{st.serviceId=x.dataset.s;st.staffId='any';st.slot=null;draw();});
    rest.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{st.staffId=x.dataset.p;st.slot=null;draw();});
    rest.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{st.courtId=x.dataset.k;st.slot=null;draw();});
    rest.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{st.date=x.dataset.d;st.slot=null;draw();});
    rest.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{st.slot=sl.find(s=>s.t===+x.dataset.t);draw();});
    rest.querySelector('#nb-go').onclick=()=>{
      const k={id:uid(),bizId:b.id,custId:c.id,resId:st.slot.resId,serviceId:cp.kind==='STAFF'?st.serviceId:null,date:st.date,start:st.slot.t,dur:st.slot.dur,price:priceFor(b,st,st.slot.t),status:needsDeposit(b,c)?'PENDING_DEPOSIT':'CONFIRMED',created:Date.now(),reminded:false,stamped:false};
      S.bookings.push(k); notifyCust(b); save(); close(); ui.agendaDate=k.date; rerender();
      toast(k.status==='PENDING_DEPOSIT'?`Reserva creada, pendiente de abono. Se le avisó a ${first(c)}.`:`Reserva creada. Se le avisó a ${first(c)}.`);

  customerPicker(body.querySelector('#nb-c'),st,draw);

    <p class="small" id="cc-err" role="alert" style="color:var(--rose);min-height:20px;margin:8px 0 0"></p></div>`;

function drawStampPreview(v,b){
  const st=ui.stamps, el=v.querySelector('#st-prev'), btn=v.querySelector('#st-go'); if(!el) return;
  const p=prog(st.progId), c=st.custId?cust(st.custId):null;
  el.innerHTML=c?punchCard(p,member(c.id,p.id)||{count:0},{title:c.name,popIndex:st.pop}):'';
  st.pop=null;
  btn.disabled=!c; btn.textContent=c?'Sumar sello':'Busca un cliente';
}
function bindStamps(v,b){
  const st=ui.stamps;
  const host=v.querySelector('#st-c');
  if(host) customerPicker(host,st,()=>drawStampPreview(v,b),{progId:()=>st.progId});
  drawStampPreview(v,b);
  v.querySelectorAll('[data-prog]').forEach(x=>x.onclick=()=>{st.progId=x.dataset.prog;rerender();});
  const go=v.querySelector('#st-go');
  if(go) go.onclick=()=>{
    const c=cust(st.custId), p=prog(st.progId); if(!c) return;
    const {m,unlocked}=addStamp(b,c,p); save();
    if(unlocked){ rerender(); rewardUnlockedSheet(b,c,[{p,r:unlocked}]); }
    else { st.pop=m.count; rerender(); toast(`Sello sumado: ${m.count} de ${p.goal}`); }
  };
  const mk=v.querySelector('[data-act="mkprog"]'); if(mk) mk.onclick=()=>{ui.tab='programs';render();progForm(b);};
  const cells=[...v.querySelectorAll('#cc input')], err=v.querySelector('#cc-err'), box=v.querySelector('#cc');
  const OK=/[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]/;
  const val=()=>cells.map(c=>c.value).join('');
  const check=()=>{
    st.code=val(); box.classList.remove('err'); err.textContent='';
    if(st.code.length<6) return;
    const r=S.rewards.find(x=>x.code===st.code);
    const fail=m=>{box.classList.add('err');err.textContent=m;};
    if(!r) return fail('Ese código no existe. Revisa las letras.');
    const p=prog(r.progId);
    if(!p||p.bizId!==b.id){ const ob=p&&S.biz.find(x=>x.id===p.bizId); return fail(`Ese premio es de ${ob?ob.name:'otro negocio'}.`); }
    const rs=rewardStatus(r);
    if(rs==='REDEEMED') return fail(`Ese premio ya se canjeó el ${fmtDate(r.redeemed)}.`);
    if(rs==='EXPIRED') return fail(`Ese premio venció el ${fmtDate(r.expires)}.`);
    const c=cust(r.custId);
    sheet(`<h3>Canjear premio</h3><div class="list"><div class="item"><div class="dot" style="background:${caps(b).color}">${I.gift}</div><div class="grow"><span class="t">${esc(p.reward)}</span><span class="s">${esc(c.name)} · vence el ${fmtDate(r.expires)}</span></div></div></div>
      <div class="row"><button class="btn ghost" data-close style="flex:1">Volver</button><button class="btn teal" id="rd-ok" style="flex:1">Confirmar canje</button></div>`,(el,close)=>{
      el.querySelector('#rd-ok').onclick=()=>{r.status='REDEEMED';r.redeemed=Date.now();st.code='';save();close();rerender();toast(`Premio canjeado a ${first(c)}`);};});
  };
  cells.forEach((inp,i)=>{
    inp.oninput=()=>{ let ch=inp.value.toUpperCase().slice(-1); if(!OK.test(ch)) ch=''; inp.value=ch; if(ch&&i<5) cells[i+1].focus(); check(); };
    inp.onkeydown=e=>{ if(e.key==='Backspace'&&!inp.value&&i>0){ cells[i-1].focus(); cells[i-1].value=''; check(); e.preventDefault(); } };
    inp.onpaste=e=>{ const t=(e.clipboardData||window.clipboardData).getData('text').toUpperCase().replace(/[^A-Z0-9]/g,'').split('').filter(ch=>OK.test(ch)).slice(0,6);
      if(!t.length) return; e.preventDefault(); t.forEach((ch,j)=>{ if(cells[j]) cells[j].value=ch; }); cells[Math.min(t.length,5)].focus(); check(); };
  });
}

/* ================= Resumen ================= */
function statsView(b){
  const ids=new Set(S.progs.filter(p=>p.bizId===b.id).map(p=>p.id));
  const ms=S.members.filter(m=>ids.has(m.progId));
  const stamps=ms.reduce((a,m)=>a+m.history.filter(h=>h.kind==='STAMP').length,0);
  const rs=S.rewards.filter(r=>ids.has(r.progId));
  const used=rs.filter(r=>r.status==='REDEEMED').length, open=rs.filter(r=>rewardStatus(r)==='AVAILABLE').length;
  const bk=S.bookings.filter(k=>k.bizId===b.id);
  const week=bk.filter(k=>k.date>=dayFrom(0)&&k.date<=dayFrom(6)&&k.status!=='CANCELLED').length;
  const ns=bk.filter(k=>k.status==='NO_SHOW').length, done=bk.filter(k=>k.status==='ATTENDED').length;
  const close=ms.filter(m=>{const p=prog(m.progId);return p.active&&m.count>0&&p.goal-m.count<=2;}).sort((x,y)=>(prog(x.progId).goal-x.count)-(prog(y.progId).goal-y.count));
  return `<div class="wrap"><div class="hello"><h2>Resumen</h2><p>Cómo va la fidelización de tu negocio.</p></div>
    <div class="stats">
      <div class="stat"><b>${new Set(ms.map(m=>m.custId)).size}</b><span>Clientes con tarjeta</span></div>
      <div class="stat"><b>${stamps}</b><span>Sellos entregados</span></div>
      <div class="stat"><b>${open}</b><span>Premios por canjear</span></div>
      <div class="stat"><b>${used}</b><span>Premios canjeados</span></div>
      ${caps(b).hasBooking?`<div class="stat"><b>${week}</b><span>Reservas próximos 7 días</span></div><div class="stat"><b>${done+ns?Math.round(ns/(done+ns)*100):0}%</b><span>Inasistencias</span></div>`:''}
      <div class="stat" style="grid-column:1/-1"><b>${S.sent[b.id]||0}</b><span>Avisos automáticos enviados a tus clientes: recordatorios, "te falta 1" y "hace un mes no vienes"</span></div></div>
    <div class="sec">A punto de completar</div>
    ${close.length?`<div class="list">${close.map(m=>{const p=prog(m.progId),c=cust(m.custId),l=p.goal-m.count;return `<div class="item"><div class="grow"><span class="t">${esc(c.name)}</span><span class="s">${esc(p.name)} · ${l===1?'le falta 1':'le faltan '+l}</span></div><button class="btn teal sm" data-near="${c.id}|${p.id}">Sumar sello</button></div>`}).join('')}</div>`:'<div class="empty">Nadie está a 2 sellos o menos del premio.</div>'}</div>`;
}

const copyWeek=w=>{const o={};for(let d=1;d<=7;d++)o[d]=(w&&w[d]?w[d]:[]).map(x=>[x[0],x[1]]);return o;};
const fallbackWeek=b=>{const o={};for(let d=1;d<=7;d++)o[d]=weeklyBiz(b,d).map(x=>[x[0],x[1]]);return o;};
const shortDay=d=>DOW[d-1].slice(0,3).toLowerCase();
function weekSummary(w){
  const open=[1,2,3,4,5,6,7].filter(d=>w[d]&&w[d].length);
  if(!open.length) return 'Cerrado toda la semana';
  const f=w[open[0]];
  return `${open.length===7?'Todos los días':`${open.length} días a la semana`} · desde ${fmtHM(f[0][0])}`;
}
const back=(to,label)=>`<button class="linkbtn" data-back="${to}">‹ ${label}</button>`;
const sitem=(icon,title,sub,go,extra='')=>`<button class="item" ${go?`data-go="${go}"`:''} ${extra}><div class="dot plain">${I[icon]}</div><div class="grow"><span class="t">${title}</span>${sub?`<span class="s">${sub}</span>`:''}</div>${go?'<span class="chev">›</span>':''}</button>`;

/* Editor de horario semanal */
function weekErrors(w,bizWeek){
  const errs=[];
  for(let d=1;d<=7;d++){ const fs=[...(w[d]||[])].sort((a,b)=>a[0]-b[0]);
    fs.forEach((f,i)=>{ if(f[1]<=f[0]) errs.push({d,f,msg:'Esta franja termina antes de empezar'});
      if(i>0&&f[0]<fs[i-1][1]) errs.push({d,f,msg:`Se cruza con ${fmtRange(fs[i-1][0],fs[i-1][1])}`}); }); }
  return errs;
}
function outside(f,bizDay){ return !bizDay.some(w=>f[0]>=w[0]&&f[1]<=w[1]); }
function scheduleEditor(w,bizWeek){
  const errs=weekErrors(w,bizWeek);
  return `<div class="list">${[1,2,3,4,5,6,7].map(d=>{const fs=[...(w[d]||[])].sort((a,b)=>a[0]-b[0]), open=fs.length>0;
    return `<div class="item" style="display:block">
      <div class="row between"><span class="t">${DOW[d-1]}</span><div class="row" style="gap:8px">${open?`<button class="btn ghost sm" data-copy="${d}">Copiar a todos</button>`:''}<span class="small muted">${open?'Abierto':'Cerrado'}</span><button class="switch" role="switch" aria-checked="${open}" aria-label="${DOW[d-1]} abierto" data-dsw="${d}"></button></div></div>
      ${open?`<div class="chips" style="margin-top:10px">${fs.map((f,i)=>{const e=errs.find(x=>x.d===d&&x.f===w[d].find(y=>y[0]===f[0]&&y[1]===f[1])), out=bizWeek&&outside(f,bizWeek[d]||[]);
        return `<span class="chip franja${e||out?' bad':''}"><button style="border:0;background:none;padding:0;font-weight:600;color:inherit" data-fe="${d}|${f[0]}|${f[1]}" aria-label="Editar franja ${fmtRange(f[0],f[1])}">${fmtRange(f[0],f[1])}</button><button class="x" data-fx="${d}|${f[0]}|${f[1]}" aria-label="Quitar franja">×</button></span>`}).join('')}
        <button class="btn ghost sm" data-fadd="${d}">Agregar franja</button></div>
        ${errs.filter(x=>x.d===d).map(x=>`<p class="small" style="color:var(--rose);margin:6px 0 0">${x.msg}${x.msg.endsWith('.')?'':'.'}</p>`).join('')}
        ${bizWeek&&fs.some(f=>outside(f,bizWeek[d]||[]))?`<p class="small" style="color:var(--rose);margin:6px 0 0">Parte de este horario está fuera del horario del negocio${(bizWeek[d]||[]).length?` (${bizWeek[d].map(x=>fmtRange(x[0],x[1])).join(' y ')})`:': ese día el negocio está cerrado'}.</p>`:''}`:''}
    </div>`}).join('')}</div>`;
}
function franjaSheet(onSave,init){
  const [s0,e0]=init;
  sheet(`<h3>${init.edit?'Editar franja':'Nueva franja'}</h3>
    <div class="two"><label class="f">Desde<select id="fr-s">${timeOpts(s0,0,1410)}</select></label><label class="f">Hasta<select id="fr-e">${timeOpts(e0,30,1440)}</select></label></div>
    <p class="small" id="fr-err" style="color:var(--rose);min-height:18px;margin:0"></p>
    <div class="row"><button class="btn ghost" data-close style="flex:1">Cancelar</button><button class="btn teal" id="fr-ok" style="flex:1">Listo</button></div>`,(el,close)=>{
    el.querySelector('#fr-ok').onclick=()=>{const s=+el.querySelector('#fr-s').value,e=+el.querySelector('#fr-e').value;
      if(e<=s){el.querySelector('#fr-err').textContent='Esta franja termina antes de empezar.';return;} close(); onSave([s,e]);};
  });
}
function bindScheduleEditor(v,w){
  const ch=()=>{ui.dirty=true;rerender();};
  v.querySelectorAll('[data-dsw]').forEach(x=>x.onclick=()=>{const d=+x.dataset.dsw; w[d]=w[d]&&w[d].length?[]:[[H(8),H(18)]]; ch();});
  v.querySelectorAll('[data-copy]').forEach(x=>x.onclick=()=>{const d=+x.dataset.copy; for(let i=1;i<=7;i++) w[i]=w[d].map(f=>[f[0],f[1]]); ch(); toast(`Copiado el horario del ${DOW[d-1].toLowerCase()} a todos los días`);});
  v.querySelectorAll('[data-fx]').forEach(x=>x.onclick=()=>{const [d,s,e]=x.dataset.fx.split('|').map(Number); w[d]=w[d].filter(f=>!(f[0]===s&&f[1]===e)); ch();});
  v.querySelectorAll('[data-fe]').forEach(x=>x.onclick=()=>{const [d,s,e]=x.dataset.fe.split('|').map(Number); const init=[s,e]; init.edit=true;
    franjaSheet(nf=>{const f=w[d].find(f=>f[0]===s&&f[1]===e); if(f){f[0]=nf[0];f[1]=nf[1];} ch();},init);});
  v.querySelectorAll('[data-fadd]').forEach(x=>x.onclick=()=>{const d=+x.dataset.fadd, last=[...w[d]].sort((a,b)=>b[1]-a[1])[0];
    const s=last?Math.min(last[1]+60,1380):H(8), e=Math.min(s+H(4),1440);
    franjaSheet(nf=>{w[d].push(nf); ch();},[s,e]);});
}
function exceptionSheet(b){
  const st={resId:null,from:dayFrom(1),to:dayFrom(1),partial:false,s:H(12),e:H(14),reason:''};
  const {body,close}=sheet('<div id="xf"></div>');
  const draw=()=>{
    const to=st.to<st.from?st.from:st.to;
    const hits=S.bookings.filter(k=>k.bizId===b.id&&['CONFIRMED','PENDING_DEPOSIT'].includes(k.status)&&k.date>=st.from&&k.date<=to&&(!st.resId||k.resId===st.resId)&&(!st.partial||(k.start<st.e&&st.s<k.start+k.dur)));
    body.querySelector('#xf').innerHTML=`<h3>Nueva excepción</h3>
      <div class="flabel" style="margin-top:0">Aplica a</div><div class="chips"><button class="chip" data-sc="" aria-pressed="${!st.resId}">Todo el negocio</button>${activeRes(b).map(r=>`<button class="chip" data-sc="${r.id}" aria-pressed="${st.resId===r.id}">${esc(r.name)}</button>`).join('')}</div>
      <div class="two" style="margin-top:14px"><label class="f">Desde<input type="date" id="x-from" value="${st.from}"></label><label class="f">Hasta<input type="date" id="x-to" value="${to}" min="${st.from}"></label></div>
      <div class="row between" style="margin-bottom:12px"><span class="small" style="font-weight:600">Solo unas horas</span><button class="switch" role="switch" aria-checked="${st.partial}" aria-label="Solo unas horas" id="x-part"></button></div>
      ${st.partial?`<div class="two"><label class="f">Cerrado desde<select id="x-s">${timeOpts(st.s,0,1410)}</select></label><label class="f">Hasta<select id="x-e">${timeOpts(st.e,30,1440)}</select></label></div>`:''}
      <label class="f">Motivo<input id="x-r" value="${esc(st.reason)}" placeholder="Ej: Festivo"></label>
      <div class="chips" style="margin:-4px 0 12px">${REASONS.map(r=>`<button class="chip" data-rs="${r}" aria-pressed="${st.reason===r}">${r}</button>`).join('')}</div>
      ${hits.length?`<div class="note sun">Hay ${hits.length} ${hits.length===1?'reserva':'reservas'} en esas fechas. Revisa la agenda para avisar a los clientes.</div>`:''}
      <p class="small" id="x-err" style="color:var(--rose);min-height:18px;margin:0"></p>
      <div class="row"><button class="btn ghost" data-cl style="flex:1">Cancelar</button><button class="btn teal" id="x-ok" style="flex:1">Guardar excepción</button></div>`;
    const g=id=>body.querySelector('#'+id);
    body.querySelectorAll('[data-sc]').forEach(x=>x.onclick=()=>{st.resId=x.dataset.sc||null;draw();});
    g('x-from').onchange=()=>{st.from=g('x-from').value||st.from; if(st.to<st.from) st.to=st.from; draw();};
    g('x-to').onchange=()=>{st.to=g('x-to').value||st.to; draw();};
    g('x-part').onclick=()=>{st.partial=!st.partial;draw();};
    if(g('x-s')){ g('x-s').onchange=()=>{st.s=+g('x-s').value;draw();}; g('x-e').onchange=()=>{st.e=+g('x-e').value;draw();}; }
    g('x-r').oninput=()=>{st.reason=g('x-r').value;};
    body.querySelectorAll('[data-rs]').forEach(x=>x.onclick=()=>{st.reason=x.dataset.rs;draw();});
    body.querySelector('[data-cl]').onclick=close;
    g('x-ok').onclick=()=>{
      if(!st.reason.trim()){g('x-err').textContent='Escribe el motivo.';g('x-r').focus();return;}
      if(st.partial&&st.e<=st.s){g('x-err').textContent='La hora final debe ser después de la inicial.';return;}
      b.exceptions.push({id:uid(),resId:st.resId,from:st.from,to:st.to<st.from?st.from:st.to,startMin:st.partial?st.s:null,endMin:st.partial?st.e:null,reason:st.reason.trim()});
      save(); close(); rerender(); toast('Excepción guardada');
    };
  };
  draw();
}
function bindSettings(v,b){
  const cp=caps(b), s=ui.settings;
  v.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{ui.settings=x.dataset.go;ui.draft=null;ui.dirty=false;render();$('#view').scrollTop=0;});
  v.querySelectorAll('[data-back]').forEach(x=>x.onclick=()=>guard(()=>{ui.settings=x.dataset.back;ui.draft=null;ui.dirty=false;render();}));
  const on=(a,f)=>{const e=v.querySelector(`[data-act="${a}"]`);if(e)e.onclick=f;};
  const saveBtn=v.querySelector('[data-save]');
  if(s==='home'){
    on('pin',()=>{ if(!S.pin) return pinSheet(); confirmDialog({title:'¿Quitar el PIN?',text:'Cualquiera con acceso al dispositivo podrá entrar a tu negocio.',cta:'Quitar PIN',danger:true,onOk:()=>{S.pin=null;save();rerender();toast('PIN quitado');}}); });
    on('theme',()=>sheet(`<h3>Tema</h3><div class="chips">${[['system','Igual que el sistema'],['light','Claro'],['dark','Oscuro']].map(([k,l])=>`<button class="chip" data-th="${k}" aria-pressed="${S.theme===k}">${l}</button>`).join('')}</div><button class="btn full" data-close style="margin-top:18px">Listo</button>`,(el)=>{
      el.querySelectorAll('[data-th]').forEach(x=>x.onclick=()=>{S.theme=x.dataset.th;save();applyTheme();el.querySelectorAll('[data-th]').forEach(y=>y.setAttribute('aria-pressed',y===x));rerender();});}));
    on('lock',()=>{S.locked=true;save();render();});
    on('logout',()=>confirmDialog({title:'¿Cerrar sesión?',text:'Para volver a entrar necesitas tu correo y contraseña.',cta:'Cerrar sesión',danger:true,onOk:()=>{S.session=null;S.locked=false;ui={...ui,tab:null,settings:null,draft:null,dirty:false,custSel:null,stamps:{q:'',custId:null,progId:null,code:''}};save();render();}}));
  }
  if(s==='info'){
    v.querySelectorAll('[data-f]').forEach(x=>x.oninput=()=>{ui.draft[x.dataset.f]=x.value; if(!ui.dirty){ui.dirty=true;const pos=x.selectionStart,f=x.dataset.f;rerender();const n=v.ownerDocument.querySelector(`[data-f="${f}"]`);n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}} else saveBtn.disabled=!ui.draft.name.trim();});
    saveBtn.onclick=()=>{const d=ui.draft; b.name=d.name.trim(); b.address=d.address.trim()||'Sin dirección'; b.phone=d.phone.replace(/\D/g,''); b.desc=d.desc.trim(); b.offers=d.offers.split(',').map(x=>x.trim()).filter(Boolean);
      ui.dirty=false; ui.draft=null; save(); ui.settings='home'; render(); toast('Información guardada');};
  }
  if(s==='hours'){
    bindScheduleEditor(v,ui.draft.week);
    saveBtn.onclick=()=>{b.hours=copyWeek(ui.draft.week); ui.dirty=false; ui.draft=null; save(); ui.settings='home'; render(); toast('Horario guardado');};
  }
  if(s==='booking'){
    v.querySelectorAll('[data-n]').forEach(x=>x.onchange=x.oninput=()=>{ui.draft[x.dataset.n]=+x.value||0; if(!ui.dirty){ui.dirty=true;rerender();} else saveBtn.disabled=!(b.hours||ui.draft.close>ui.draft.open);});
    v.querySelectorAll('[data-lp]').forEach(x=>x.onclick=()=>{const id=x.dataset.lp,l=ui.draft.programIds; ui.draft.programIds=l.includes(id)?l.filter(i=>i!==id):[...l,id]; ui.dirty=true; rerender();});
    saveBtn.onclick=()=>{Object.assign(b.booking,ui.draft); ui.dirty=false; ui.draft=null; save(); ui.settings='home'; render(); toast('Reservas guardadas');};
  }
  if(s==='resources'){
    on('addres',()=>{const n=v.querySelector('#newres').value.trim(); if(!n){v.querySelector('#newres').focus();toast('Escribe el nombre');return;}
      if(b.resources.some(r=>r.status==='ACTIVE'&&norm(r.name)===norm(n))){toast('Ya existe uno con ese nombre');return;}
      const r={id:uid(),name:n,kind:cp.kind,status:'ACTIVE',schedule:null,serviceIds:cp.kind==='STAFF'?b.services.map(x=>x.id):[]};
      if(cp.kind==='TABLE') r.capacity=+v.querySelector('#newcap').value;
      b.resources.push(r); save(); rerender(); toast(`${KIND[cp.kind].one} agregado${cp.kind==='STAFF'?' con todos los servicios':''}`);});
    const nr=v.querySelector('#newres'); if(nr) nr.onkeydown=e=>{if(e.key==='Enter')v.querySelector('[data-act="addres"]').click();};
  }
  if(s.startsWith('res:')){
    const r=resOf(b,s.slice(4)), d=ui.draft;
    if(d.week) bindScheduleEditor(v,d.week);
    on('custom',()=>{d.week=b.hours?copyWeek(b.hours):fallbackWeek(b); ui.dirty=true; rerender();});
    on('inherit',()=>{d.week=null; ui.dirty=true; rerender();});
    v.querySelectorAll('[data-svc]').forEach(x=>x.onclick=()=>{const id=x.dataset.svc; d.services=d.services.includes(id)?d.services.filter(i=>i!==id):[...d.services,id]; ui.dirty=true; rerender();});
    on('delres',()=>{
      const pend=S.bookings.filter(k=>k.resId===r.id&&['CONFIRMED','PENDING_DEPOSIT'].includes(k.status)&&keyTime(k.date,k.start+k.dur)>Date.now()).length;
      if(pend){ confirmDialog({title:`${r.name} tiene reservas pendientes`,text:`Hay ${pend} ${pend===1?'reserva':'reservas'} por atender. Cancélalas o atiéndelas antes de quitarlo.`,cta:'Ir a la agenda',onOk:()=>{ui.dirty=false;ui.draft=null;ui.settings=null;ui.tab='agenda';render();}}); return; }
      confirmDialog({title:`¿Quitar a ${r.name}?`,text:'Deja de aparecer en la agenda y al reservar. Su historial se conserva.',cta:`Quitar ${KIND[cp.kind].one.toLowerCase()}`,danger:true,onOk:()=>{r.status='INACTIVE';ui.dirty=false;ui.draft=null;ui.settings='resources';save();render();toast(`${r.name} quitado`);}});
    });
    if(saveBtn) saveBtn.onclick=()=>{r.schedule=d.week?copyWeek(d.week):null; r.serviceIds=[...d.services]; ui.dirty=false; ui.draft=null; save(); ui.settings='resources'; render(); toast('Cambios guardados');};
  }
  if(s==='services'){
    on('addsvc',()=>{const n=v.querySelector('#sv-n').value.trim(), p=+v.querySelector('#sv-p').value;
      if(!n){v.querySelector('#sv-n').focus();toast('Escribe el nombre del servicio');return;}
      if(!(p>0)){v.querySelector('#sv-p').focus();toast('Escribe el precio');return;}
      const sv={id:uid(),name:n,duration:+v.querySelector('#sv-d').value,price:p}; b.services.push(sv);
      activeRes(b).forEach(r=>r.serviceIds.push(sv.id)); save(); rerender(); toast(`${n} agregado a todos los profesionales`);});
    v.querySelectorAll('[data-delsvc]').forEach(x=>x.onclick=()=>{const sv=svcOf(b,x.dataset.delsvc);
      confirmDialog({title:`¿Quitar «${sv.name}»?`,text:'Ya no se podrá reservar. Las reservas existentes se mantienen.',cta:'Quitar servicio',danger:true,onOk:()=>{b.services=b.services.filter(y=>y.id!==sv.id); b.resources.forEach(r=>r.serviceIds=r.serviceIds.filter(i=>i!==sv.id)); save(); rerender(); toast('Servicio quitado');}});});
  }
  if(s==='exceptions'){
    on('newx',()=>exceptionSheet(b));
    on('past',()=>{ui.showPast=!ui.showPast;rerender();});
    v.querySelectorAll('[data-delx]').forEach(x=>x.onclick=()=>{const ex=b.exceptions.find(y=>y.id===x.dataset.delx);
      confirmDialog({title:`¿Quitar «${ex.reason}»?`,text:'Esas fechas vuelven a seguir el horario normal.',cta:'Quitar excepción',danger:true,onOk:()=>{b.exceptions=b.exceptions.filter(y=>y.id!==ex.id);save();rerender();toast('Excepción quitada');}});});
  }
}

/* ================= Arranque ================= */
const setSize=sz=>{dev().dataset.size=sz;$('#vPhone').setAttribute('aria-pressed',sz==='phone');$('#vTablet').setAttribute('aria-pressed',sz==='tablet');if(S.session) rerender();};
$('#vPhone').onclick=()=>setSize('phone');
$('#vTablet').onclick=()=>setSize('tablet');
let lastWide=null;
if(window.ResizeObserver) new ResizeObserver(()=>{const w=isWide(); if(lastWide!==null&&w!==lastWide&&S.session&&!document.querySelector('.sheet-bg,.dialog-bg')) rerender(); lastWide=w;}).observe(dev());
document.addEventListener('visibilitychange',()=>{ if(document.hidden) S.hiddenAt=Date.now(); else if(S.pin&&S.session&&S.hiddenAt&&Date.now()-S.hiddenAt>5*60000){S.locked=true;save();render();} });
render();
</script>
